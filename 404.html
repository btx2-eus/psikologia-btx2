<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orria ez da aurkitu · Psikologiaren Lenteen Atlasa</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#F4F1E9; --urdin:#1B3A5C; --more:#6D5DD3; --ink-2:#4A565F; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      font-family: 'Inter', system-ui, sans-serif; color: var(--ink-2);
      background: radial-gradient(900px 500px at 70% -10%, #fbf8f0, transparent 60%), var(--paper);
      padding: 2rem;
    }
    .kutxa { max-width: 32rem; }
    .ikono { width: 84px; height: 84px; margin: 0 auto 1.5rem; display: block; }
    h1 { font-family: 'Nunito', sans-serif; font-weight: 900; color: var(--urdin); font-size: clamp(2.2rem, 7vw, 3.4rem); margin: 0 0 .3rem; }
    .lente-zenb { font-family: 'Nunito', sans-serif; font-weight: 900; color: var(--more); font-size: 4rem; line-height: 1; }
    p { font-size: 1.1rem; margin: .6rem 0 2rem; }
    a {
      display: inline-block; font-family: 'Nunito', sans-serif; font-weight: 800;
      background: var(--urdin); color: #fff; text-decoration: none;
      padding: .8rem 1.6rem; border-radius: 999px; transition: transform .2s, background .2s;
    }
    a:hover { transform: translateY(-2px); background: #224a73; }
  </style>
</head>
<body>
  <main class="kutxa">
    <svg class="ikono" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="19" cy="20" r="10" fill="none" stroke="#6D5DD3" stroke-width="2.4"/>
      <circle cx="29" cy="24" r="10" fill="none" stroke="#3CB39A" stroke-width="2.4"/>
      <circle cx="24" cy="30" r="10" fill="none" stroke="#D98A3A" stroke-width="2.4"/>
    </svg>
    <p class="lente-zenb">404</p>
    <h1>Lente honek ez du ezer erakusten</h1>
    <p>Bilatzen ari zaren orria ez dago hemen. Baina Psikologiak badu zer ikusi.</p>
    <a href="/psikologia-btx2/">↩ Itzuli hasierara</a>
  </main>
</body>
</html>

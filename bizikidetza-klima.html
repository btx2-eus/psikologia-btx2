<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<title>Gelako bizikidetza-klima</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column. Two modes (ikaslea / irakaslea) under the header; student flow is a 4-step bar.
   Deliberately light-only (the user prefers light tones), so every color is set explicitly here. Bloke 3 plum identity. */
:root {
  color-scheme: light;
  --bg: #fdfbfd;
  --surface: #ffffff;
  --fg: #221a23;
  --muted: #6a5a6c;
  --line: #ece3ed;
  --accent: #5C1A5C;
  --accent-soft: #f6e9f6;
  --accent-ink: #ffffff;
  --serA: #7A2A7A;   /* series A: nire gela / mi clase (circle) */
  --serB: #2F7FC1;   /* series B: ni / yo (diamond) — pair validated for CVD */
  --ok: #1d6e46; --ok-soft: #dcefe4;
  --warn: #8a4b00; --warn-soft: #fbe8d2;
  --font-display: 'Nunito', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --radius: 12px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 1.5rem 4rem; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); font-weight: 900; }
h2 { font-size: 1.35rem; font-weight: 900; }
h3 { font-size: 1.05rem; font-weight: 800; }
p { margin: 0; }
a { color: var(--accent); }
.eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
header.top { display: grid; gap: 0.6rem; margin-bottom: 1.2rem; }
.top-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.lead { color: var(--muted); max-width: 62ch; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 0.3rem 0.85rem; border-radius: 999px; font: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 1.4rem; }
.modes button { border: 0; background: transparent; font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 1rem; padding: 0.7rem 0.4rem; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.modes button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.steps { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 0.5rem; border-bottom: 1px solid var(--line); margin-bottom: 1.6rem; }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
.steps button { width: 100%; border: 0; background: transparent; cursor: pointer; padding: 0.35rem 0.2rem 0.4rem; text-align: left; border-top: 3px solid var(--line); font: inherit; font-size: 0.8rem; color: var(--muted); font-weight: 500; }
.steps button .n { font-family: var(--font-display); font-weight: 900; margin-right: 0.3rem; }
.steps button[aria-current="step"] { border-top-color: var(--accent); color: var(--fg); font-weight: 600; }
.steps button.done { border-top-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.steps button:disabled { cursor: default; opacity: 0.55; }
@media (max-width: 520px) { .steps button .lbl { display: none; } .steps button { text-align: center; } }
.progress { height: 4px; background: var(--line); border-radius: 4px; margin-top: 0.45rem; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.progress-label { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; font-variant-numeric: tabular-nums; }
section.step, section.mode { display: grid; gap: 1.2rem; }
.step, .item, #stuResult, #teaResult { scroll-margin-top: 6rem; }
.galdera { font-family: var(--font-display); font-size: 1.35rem; font-weight: 900; color: var(--accent); line-height: 1.3; border-left: 4px solid var(--accent); padding-left: 1rem; }
.fenomenoa { background: var(--accent-soft); border-radius: var(--radius); padding: 1.1rem 1.2rem; font-style: italic; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.2rem; display: grid; gap: 0.9rem; min-width: 0; }
.notice { background: var(--accent-soft); border-radius: var(--radius); padding: 1rem 1.1rem; display: grid; gap: 0.4rem; }
.row { display: flex; gap: 0.7rem; flex-wrap: wrap; align-items: center; }
.next { justify-content: flex-end; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 0.6rem 1.1rem; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible, .seg button:focus-visible, .modes button:focus-visible, .steps button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 2px; }
.field { display: grid; gap: 0.35rem; }
.field label, .field .lbl { font-weight: 600; font-size: 0.92rem; }
input[type="text"], textarea, select { font: inherit; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 0.55rem 0.7rem; max-width: 100%; }
input[type="text"]:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { width: 100%; min-height: 9rem; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.8rem; line-height: 1.45; }
.err { color: var(--warn); font-weight: 600; font-size: 0.92rem; }
.patterns { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 0.6rem; margin: 0; padding: 0; list-style: none; }
.patterns li { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0.7rem 0.85rem; display: grid; gap: 0.15rem; }
.patterns b { font-family: var(--font-display); font-weight: 800; }
.patterns span { font-size: 0.86rem; color: var(--muted); }
/* items */
.scale-legend { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.3rem; font-size: 0.74rem; color: var(--muted); text-align: center; }
.scale-legend b { display: block; font-family: var(--font-display); font-size: 1rem; color: var(--fg); }
.items { display: grid; border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; align-items: center; gap: 0.4rem 0.8rem; padding: 0.7rem 0.2rem; border-bottom: 1px solid var(--line); }
.item.missing { background: var(--warn-soft); }
.item .num { font-family: var(--font-display); font-weight: 900; color: var(--muted); font-variant-numeric: tabular-nums; }
.opts { display: flex; gap: 0.3rem; }
.opts input { position: absolute; opacity: 0; pointer-events: none; }
.opts label { width: 2.3rem; height: 2.3rem; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.opts input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opts input:focus-visible + label { outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 2px; }
@media (max-width: 600px) { .item { grid-template-columns: 1.6rem minmax(0, 1fr); } .opts { grid-column: 1 / -1; justify-content: space-between; } .opts label { width: 2.6rem; height: 2.6rem; } }
/* verdict + checks */
.verdict { border-radius: var(--radius); padding: 0.9rem 1.1rem; display: grid; gap: 0.25rem; }
.verdict.ok { background: var(--ok-soft); } .verdict.warn { background: var(--warn-soft); }
.verdict .tag { font-family: var(--font-display); font-weight: 900; letter-spacing: 0.05em; font-size: 1.05rem; }
.verdict.ok .tag { color: var(--ok); } .verdict.warn .tag { color: var(--warn); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.45rem; }
.checks li { display: grid; grid-template-columns: 1.5rem minmax(0, 1fr); gap: 0.5rem; align-items: start; }
.ic { width: 1.4rem; height: 1.4rem; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; font-weight: 800; }
.ic.ok { background: var(--ok-soft); color: var(--ok); } .ic.warn { background: var(--warn-soft); color: var(--warn); }
/* legend + dumbbells */
.legend { display: flex; gap: 1.2rem; flex-wrap: wrap; font-size: 0.88rem; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
.mk { display: inline-block; width: 11px; height: 11px; flex: none; }
.mk.a { background: var(--serA); border-radius: 50%; }
.mk.b { background: var(--serB); transform: rotate(45deg) scale(0.86); border-radius: 2px; }
.mk.mid { width: 0; height: 1em; border-left: 2px dashed var(--muted); }
.dumbbells { display: grid; gap: 0.9rem; }
.db { display: grid; grid-template-columns: minmax(9rem, 13rem) minmax(0, 1fr) 6.2rem; gap: 0.3rem 0.9rem; align-items: center; }
.db .name { font-weight: 600; font-size: 0.92rem; line-height: 1.25; }
.db .vals { font-size: 0.82rem; font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; line-height: 1.35; }
.db .vals b { color: var(--fg); font-weight: 600; }
.track { position: relative; height: 22px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--line); border-radius: 2px; }
.track .midl { position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px dashed color-mix(in srgb, var(--muted) 70%, transparent); }
.track .gap { position: absolute; top: 50%; height: 3px; margin-top: -1.5px; background: color-mix(in srgb, var(--muted) 45%, transparent); border-radius: 2px; }
.track .dot { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid var(--surface); box-sizing: content-box; }
.track .dot.a { background: var(--serA); border-radius: 50%; }
.track .dot.b { background: var(--serB); border-radius: 2px; transform: rotate(45deg) scale(0.9); }
.axis { display: grid; grid-template-columns: minmax(9rem, 13rem) minmax(0, 1fr) 6.2rem; gap: 0 0.9rem; }
.axis .ticks { position: relative; height: 1.1em; font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis .ticks span { position: absolute; transform: translateX(-50%); }
.axis .ticks span:first-child { transform: none; } .axis .ticks span:last-child { transform: translateX(-100%); }
@media (max-width: 560px) {
  .db, .axis { grid-template-columns: minmax(0, 1fr) 5.4rem; }
  .db .name { grid-column: 1 / -1; }
  .axis > :first-child { display: none; }
}
/* radar */
.radar { position: relative; margin: 0; max-width: 460px; justify-self: center; width: 100%; }
.radar svg { width: 100%; height: auto; display: block; overflow: visible; }
.radar .grid { fill: none; stroke: var(--line); stroke-width: 1; }
.radar .grid.mid { stroke: var(--muted); stroke-dasharray: 4 4; }
.radar .spoke { stroke: var(--line); stroke-width: 1; }
.radar .lbl { fill: var(--fg); font-family: var(--font-display); font-weight: 800; font-size: 16.5px; }
.radar .ring { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.radar .areaA { fill: var(--serA); fill-opacity: 0.12; stroke: var(--serA); stroke-width: 2; stroke-linejoin: round; }
.radar .areaB { fill: var(--serB); fill-opacity: 0.08; stroke: var(--serB); stroke-width: 2; stroke-linejoin: round; stroke-dasharray: 6 3; }
.radar .dotA { fill: var(--serA); stroke: var(--surface); stroke-width: 2; }
.radar .dotB { fill: var(--serB); stroke: var(--surface); stroke-width: 2; }
.radar .hit { fill: transparent; cursor: pointer; outline: none; }
/* distribution: diverging stacked bars (orange = low, gray = mid, teal-green = high; adjacent steps validated) */
.dist { position: relative; display: grid; gap: 0.55rem; --d1: #A84A0C; --d2: #EFA266; --d3: #E2DEE2; --d4: #6DBB9B; --d5: #1E7A62; }
.dist .legend .mk { border-radius: 3px; width: 12px; height: 12px; }
.dist .mk.s1, .dist .dseg.s1 { background: var(--d1); } .dist .mk.s2, .dist .dseg.s2 { background: var(--d2); }
.dist .mk.s3, .dist .dseg.s3 { background: var(--d3); } .dist .mk.s4, .dist .dseg.s4 { background: var(--d4); }
.dist .mk.s5, .dist .dseg.s5 { background: var(--d5); }
.drow { display: grid; grid-template-columns: minmax(9rem, 13rem) 2.8rem minmax(0, 1fr) 2.8rem; gap: 0.3rem 0.6rem; align-items: center; }
.drow .name { font-weight: 600; font-size: 0.92rem; line-height: 1.25; }
.drow .pct { white-space: nowrap; font-size: 0.82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.drow .pct.l { text-align: right; } .drow .pct.r { text-align: left; }
.dtrack { position: relative; height: 24px; }
.dtrack .ctr { position: absolute; left: 50%; top: -4px; bottom: -4px; border-left: 2px solid var(--fg); opacity: 0.55; z-index: 1; pointer-events: none; }
.dtrack .dseg { position: absolute; top: 0; bottom: 0; border-right: 2px solid var(--surface); cursor: pointer; outline: none; }
.dtrack .dseg:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.dtrack .dseg.first { border-radius: 4px 0 0 4px; } .dtrack .dseg.last { border-radius: 0 4px 4px 0; border-right: 0; }
.pol { display: inline-block; margin-left: 0.35rem; font-size: 0.7rem; font-weight: 700; padding: 0.05rem 0.45rem; border-radius: 999px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; vertical-align: 1px; }
.daxis { display: grid; grid-template-columns: minmax(9rem, 13rem) 2.8rem minmax(0, 1fr) 2.8rem; gap: 0 0.6rem; font-size: 0.75rem; color: var(--muted); }
.daxis > :nth-child(3) { display: flex; justify-content: space-between; }
.seg-tog { margin-bottom: 0.2rem; justify-self: start; }
@media (max-width: 560px) {
  .drow, .daxis { grid-template-columns: 3.1rem minmax(0, 1fr) 3.1rem; }
  .drow .name { grid-column: 1 / -1; }
  .daxis > :first-child { display: none; }
}
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--surface); font-size: 0.8rem; font-weight: 600; padding: 0.3rem 0.55rem; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); font-variant-numeric: tabular-nums; z-index: 2; }
/* teacher */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.6rem; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem 0.9rem; background: var(--surface); display: grid; gap: 0.1rem; }
.tile .k { font-size: 0.78rem; color: var(--muted); }
.tile .v { font-family: var(--font-display); font-weight: 900; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.sample { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 0.55rem 0.8rem; font-weight: 600; font-size: 0.88rem; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; min-width: 480px; }
th, td { padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
thead th { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
.lvl { display: inline-block; font-size: 0.74rem; font-weight: 700; padding: 0.1rem 0.5rem; border-radius: 999px; white-space: nowrap; }
.lvl.hi { background: var(--ok-soft); color: var(--ok); }
.lvl.mid { background: var(--line); color: var(--muted); }
.lvl.lo { background: var(--warn-soft); color: var(--warn); }
.prio { display: grid; gap: 0.8rem; }
.prio article { border-left: 3px solid var(--warn); padding-left: 0.9rem; display: grid; gap: 0.3rem; }
.prio ul, .prose ul, .qs { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.3rem; }
.code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.9rem; letter-spacing: 0.02em; background: var(--accent-soft); padding: 0.6rem 0.8rem; border-radius: 8px; overflow-wrap: anywhere; user-select: all; }
.prose { display: grid; gap: 0.7rem; max-width: 66ch; }
details.info { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.info > summary { cursor: pointer; padding: 0.9rem 1.1rem; font-family: var(--font-display); font-weight: 800; }
details.info > .inner { padding: 0 1.1rem 1.1rem; display: grid; gap: 0.9rem; }
.check-row { display: flex; gap: 0.5rem; align-items: center; font-size: 0.9rem; }
footer.src { margin-top: 2.5rem; font-size: 0.8rem; color: var(--muted); display: grid; gap: 0.4rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media print {
  body { background: #fff; }
  .modes, .steps, .no-print, .seg, header .top-row .seg { display: none !important; }
  .card, details.info { break-inside: avoid; }
}
</style>

<div class="wrap">
  <p style="padding-top:1rem;margin:0;font-size:.85rem"><a href="index.html">← Psikologia BTX2 atarira</a></p>
  <header class="top">
    <div class="top-row">
      <span class="eyebrow" data-t="eyebrow"></span>
      <div class="seg" role="group" aria-label="Hizkuntza / Idioma">
        <button type="button" data-lang="eu" aria-pressed="true">EUS</button>
        <button type="button" data-lang="es" aria-pressed="false">CAS</button>
      </div>
    </div>
    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>
  </header>

  <div class="modes" role="tablist">
    <button type="button" role="tab" id="tab-stu" data-mode="stu" aria-selected="true" data-t="modeStu"></button>
    <button type="button" role="tab" id="tab-tea" data-mode="tea" aria-selected="false" data-t="modeTea"></button>
  </div>

  <!-- ================= IKASLEA ================= -->
  <section class="mode" id="mode-stu">
    <nav class="steps" aria-label="Urratsak">
      <ol id="stepnav"></ol>
      <div id="testprogress" hidden>
        <div class="progress"><span id="progbar"></span></div>
        <div class="progress-label" id="proglabel"></div>
      </div>
    </nav>

    <section class="step" id="step-1">
      <p class="galdera" data-t="guide"></p>
      <p class="fenomenoa" data-t="phen"></p>
      <div class="card">
        <h2 data-t="patH"></h2>
        <p class="small muted" data-t="patP"></p>
        <ul class="patterns" id="patlist"></ul>
      </div>
      <div class="notice" data-t="consent"></div>
      <div class="card">
        <div class="field">
          <label for="tag" data-t="tagL"></label>
          <input type="text" id="tag" maxlength="12" autocomplete="off" placeholder="2BTXA" style="max-width:14rem;text-transform:uppercase">
          <span class="small muted" data-t="tagHelp"></span>
          <span class="err" id="tagerr" hidden data-t="tagErr"></span>
        </div>
      </div>
      <div class="row next"><button class="btn" type="button" id="start" data-t="start"></button></div>
    </section>

    <section class="step" id="step-2" hidden>
      <span class="eyebrow" data-t="aEyebrow"></span>
      <h2 data-t="aH"></h2>
      <div class="card">
        <p data-t="aInstr"></p>
        <div class="scale-legend" id="legendA"></div>
      </div>
      <div class="items" id="itemsA"></div>
      <p class="err" id="missA" hidden role="alert"></p>
      <div class="row next"><button class="btn" type="button" id="toB" data-t="toB"></button></div>
    </section>

    <section class="step" id="step-3" hidden>
      <span class="eyebrow" data-t="bEyebrow"></span>
      <h2 data-t="bH"></h2>
      <div class="card">
        <p data-t="bInstr"></p>
        <div class="scale-legend" id="legendB"></div>
      </div>
      <div class="items" id="itemsB"></div>
      <p class="err" id="missB" hidden role="alert"></p>
      <div class="row next"><button class="btn" type="button" id="submit" data-t="submit"></button></div>
    </section>

    <section class="step" id="step-4" hidden>
      <span class="eyebrow" data-t="rEyebrow"></span>
      <h2 data-t="rH"></h2>
      <div id="stuResult"></div>
    </section>
  </section>

  <!-- ================= IRAKASLEA ================= -->
  <section class="mode" id="mode-tea" hidden>
    <div class="card">
      <h2 data-t="howH"></h2>
      <ol class="prose" style="padding-left:1.2rem" id="howList"></ol>

const mean = (xs) => xs.reduce((s, x) => s + x, 0) / xs.length;

function checks(A, B, timeOk) {
  const all = A.concat(B);
  let run = 1, best = 1;
  for (let i = 1; i < all.length; i++) { run = all[i] === all[i-1] ? run + 1 : 1; best = Math.max(best, run); }
  const m = mean(all);
  const c = { pat: { ok: best < 10, r: best }, acq: { ok: m >= 2.25 && m <= 3.75, m }, time: { ok: !!timeOk } };
  c.allOk = c.pat.ok && c.acq.ok && c.time.ok;

/* ---------- Anonymous code: BKG-{E|C}{YYMMDD}-{TAG}-{t}-{42 digits in 7×6}-{checksum} ---------- */
function checksum(s) {
  let h = 7;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i) * (i + 1)) % 1296;
  return h.toString(36).toUpperCase().padStart(2, '0');

  const l = lang === 'eu' ? 'E' : 'C', d = A.concat(B).join('');

  return `BKG-${l}${ymd}-${tag}-${t ? 1 : 0}-${groups.join('-')}-${checksum(l + ymd + tag + (t ? 1 : 0) + d)}`;

const CODE_RE = /BKG-([EC])(\d{6})-([A-Z0-9]{2,8})-([01])-((?:[1-5]{6}-){6}[1-5]{6})-([0-9A-Z]{2})(?![0-9A-Z])/g;

  const up = String(text).toUpperCase();
  const seen = new Set(), valid = []; let bad = 0, dup = 0;
  const attempts = (up.match(/BKG-/g) || []).length;
  for (const m of up.matchAll(CODE_RE)) {
    const d = m[5].replace(/-/g, '');
    if (checksum(m[1] + m[2] + m[3] + m[4] + d) !== m[6]) { bad++; continue; }
    if (seen.has(m[0])) { dup++; continue; }
    seen.add(m[0]);
    const ans = d.split('').map(Number);
    valid.push({ lang: m[1] === 'E' ? 'eu' : 'es', ymd: m[2], tag: m[3], t: m[4] === '1', A: ans.slice(0, N), B: ans.slice(N) });

  bad += Math.max(0, attempts - valid.length - dup - bad);
  return { valid, bad, dup };
}

  const sA = list.map(r => patScores(r.A)), sB = list.map(r => patScores(r.B));
  for (const p of PAT) {
    out.A[p] = mean(sA.map(s => s[p]));
    out.B[p] = mean(sB.map(s => s[p]));
    out.lowA[p] = sA.filter(s => s[p] <= 2.5).length / list.length;
    for (const [k, arr] of [['A', sA], ['B', sB]]) {
      const c = [0, 0, 0, 0, 0];
      arr.forEach(s => { c[Math.round(s[p] + 1e-9) - 1]++; });
      out.dist[k][p] = c;
    }

  out.totA = mean(PAT.map(p => out.A[p])); out.totB = mean(PAT.map(p => out.B[p]));

}

/* ---------- Example data (deterministic, clearly labelled as invented) ---------- */
function sampleCodes() {
  let seed = 20261126;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  const muA = { pra: 3.4, lis: 2.9, und: 3.1, hel: 3.8, def: 2.4, iso: 2.6, gro: 3.3 };
  const clamp = (v) => Math.max(1, Math.min(5, Math.round(v)));
  const ymd = todayYMD(), codes = [];
  for (let s = 0; s < 23; s++) {
    const off = gauss() * 0.45;
    const raw = (mu) => ITEMS.map((it, i) => { const k = clamp(mu[it[0]] + off + gauss() * 0.7); return it[1] ? 6 - k : k; });
    const mu = Object.assign({}, muA, { iso: s % 3 === 0 ? 1.2 : 4.0 });
    const muB = {}; for (const p of PAT) muB[p] = Math.min(4.6, mu[p] + 0.7 + gauss() * 0.15);
    let A = raw(mu), B = raw(muB), t = 1;
    if (s === 7) { A = Array(N).fill(4); B = Array(N).fill(4); }
    if (s === 15) t = 0;
    codes.push(makeCode(s % 5 ? 'eu' : 'es', ymd, 'ADIB', t, A, B));
  }
  return codes.join('\n');
}

  for (const v of [2, 4, 5]) g += `<polygon class="grid" points="${ring(v)}"/>`;
  g += `<polygon class="grid mid" points="${ring(3)}"/>`;
  PAT.forEach((_, i) => { const [x, y] = pt(i, 5); g += `<line class="spoke" x1="${cx}" y1="${cy}" x2="${f1(x)}" y2="${f1(y)}"/>`; });
  g += `<text class="ring" x="${cx + 4}" y="${f1(cy - R / 2 + 11)}">3</text><text class="ring" x="${cx + 4}" y="${f1(cy - R + 11)}">5</text>`;
  g += `<polygon class="areaB" points="${PAT.map((p, i) => pt(i, b[p]).map(f1).join(',')).join(' ')}"/>`;
  g += `<polygon class="areaA" points="${PAT.map((p, i) => pt(i, a[p]).map(f1).join(',')).join(' ')}"/>`;
  PAT.forEach((p, i) => {
    const an = ang(i), c = Math.cos(an), sn = Math.sin(an), d = R + 14;
    const anchor = c > 0.25 ? 'start' : c < -0.25 ? 'end' : 'middle';
    const words = t.pat[p][2].split(' ');
    const lines = words.length > 1 && t.pat[p][2].length > 11 ? [words.slice(0, -1).join(' '), words[words.length - 1]] : [t.pat[p][2]];
    const y0 = cy + d * sn + (sn < -0.5 ? -(lines.length - 1) * 17 - 4 : sn > 0.5 ? 14 : -(lines.length - 1) * 8.5 + 5);
    lines.forEach((ln, j) => { g += `<text class="lbl" x="${f1(cx + d * c)}" y="${f1(y0 + j * 17)}" text-anchor="${anchor}">${ln}</text>`; });
  });
  PAT.forEach((p, i) => {
    const [xa, ya] = pt(i, a[p]), [xb, yb] = pt(i, b[p]);
    g += `<circle class="hit" tabindex="0" cx="${f1(xb)}" cy="${f1(yb)}" r="13" data-tip="${t.pat[p][0]} · ${t.legB}: ${fmt(b[p])}"><title>${t.pat[p][0]} · ${t.legB}: ${fmt(b[p])}</title></circle>`;
    g += `<rect class="dotB" x="${f1(xb - 4.5)}" y="${f1(yb - 4.5)}" width="9" height="9" transform="rotate(45 ${f1(xb)} ${f1(yb)})"/>`;
    g += `<circle class="hit" tabindex="0" cx="${f1(xa)}" cy="${f1(ya)}" r="13" data-tip="${t.pat[p][0]} · ${t.legA}: ${fmt(a[p])}"><title>${t.pat[p][0]} · ${t.legA}: ${fmt(a[p])}</title></circle>`;
    g += `<circle class="dotA" cx="${f1(xa)}" cy="${f1(ya)}" r="5"/>`;
  });
  const label = PAT.map(p => `${t.pat[p][0]} ${fmt(a[p])} / ${fmt(b[p])}`).join(', ');
  return `<figure class="radar" data-tips><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg><span class="tip" hidden></span></figure>`;
}

/* ---------- Rendering: shared ---------- */
function renderStatic() {
  const t = L();
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(el => { const v = t[el.dataset.t]; if (typeof v === 'string') el.innerHTML = v; });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang)));
  $('patlist').innerHTML = PAT.map(p => `<li><b>${t.pat[p][0]}</b><span>${t.pat[p][1]}</span></li>`).join('');
  $('howList').innerHTML = t.how.map(h => `<li>${h}</li>`).join('');
  const leg = t.scale.map((s, i) => `<div><b>${i + 1}</b>${s}</div>`).join('');
  $('legendA').innerHTML = leg; $('legendB').innerHTML = leg;
  $('sources').innerHTML = `<strong>${t.sources}</strong>` + SOURCES.map(s => `<p>${s}</p>`).join('');
}
function renderMode() {
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === S.mode)));
  $('mode-stu').hidden = S.mode !== 'stu';
  $('mode-tea').hidden = S.mode !== 'tea';
}

/* ---------- Rendering: student ---------- */
function renderNav() {
  const t = L();
  $('stepnav').innerHTML = t.steps.map((s, i) => {
    const n = i + 1;
    return `<li><button type="button" class="${n < S.step ? 'done' : ''}" data-goto="${n}" ${n === S.step ? 'aria-current="step"' : ''} ${n > S.maxStep ? 'disabled' : ''}><span class="n">${n}</span><span class="lbl">${s}</span></button></li>`;
  }).join('');
  $('testprogress').hidden = !(S.step === 2 || S.step === 3);
  const n = S.A.concat(S.B).filter(Boolean).length;
  $('progbar').style.width = (n / (2 * N) * 100) + '%';
  $('proglabel').textContent = t.progress(n);
}
function itemsHTML(part) {
  const t = L(), ans = S[part];
  return ITEMS.map((it, i) => {
    const txt = part === 'A' ? (S.lang === 'eu' ? it[3] : it[2]) : (S.lang === 'eu' ? it[5] : it[4]);
    const id = `${part}${i}`;
    const opts = [1, 2, 3, 4, 5].map(v => `<input type="radio" name="${id}" id="${id}-${v}" value="${v}" ${ans[i] === v ? 'checked' : ''}><label for="${id}-${v}" title="${t.scale[v - 1]}">${v}</label>`).join('');
    return `<div class="item" id="it-${id}"><span class="num">${i + 1}</span><span id="qt-${id}">${txt}</span><div class="opts" role="radiogroup" aria-labelledby="qt-${id}">${opts}</div></div>`;
  }).join('');
}
function renderItems() { $('itemsA').innerHTML = itemsHTML('A'); $('itemsB').innerHTML = itemsHTML('B'); $('missA').hidden = true; $('missB').hidden = true; }
function renderStuResult() {
  const r = S.result; if (!r) { $('stuResult').innerHTML = ''; return; }
  const t = L(), c = r.checks;
  const a = patScores(r.A), b = patScores(r.B);
  const k = PAT.filter(p => b[p] - a[p] >= 0.34).length;
  const ic = (ok) => ok ? '<span class="ic ok">✓</span>' : '<span class="ic warn">!</span>';
  const mm = Math.floor(r.secs / 60), ss = Math.round(r.secs % 60);
  $('stuResult').innerHTML = `
    <div class="card">
      <div class="verdict ${c.allOk ? 'ok' : 'warn'}"><span class="tag">${c.allOk ? t.okTag : t.warnTag}</span><span class="small">${c.allOk ? t.okSub : t.warnSub}</span></div>
      <ul class="checks">
        <li>${ic(c.pat.ok)}<div><strong>${t.chkPat}.</strong> <span class="small">${t.chkPatD(c.pat.r)}</span></div></li>
        <li>${ic(c.acq.ok)}<div><strong>${t.chkAcq}.</strong> <span class="small">${t.chkAcqD(fmt(c.acq.m))}</span></div></li>
        <li>${ic(c.time.ok)}<div><strong>${t.chkTime}.</strong> <span class="small">${t.chkTimeD(`${mm} min ${ss} s`)}</span></div></li>
      </ul>
    </div>
    <div class="card">${legendHTML()}${dumbbellsHTML(a, b)}<p class="small">${k >= 3 ? t.gapMany(k) : t.gapFew}</p></div>
    <div class="card no-print">
      <h3>${t.codeH}</h3>
      <div class="code" id="stucode">${r.code}</div>
      <p class="small muted">${t.codeHelp}</p>
      <div class="row"><button class="btn" type="button" id="copyCode">${t.copy}</button><button class="btn ghost" type="button" data-goto="2">${t.review}</button><span class="small muted" id="copymsg" role="status"></span></div>
    </div>
    <div class="card"><h3>${t.qH}</h3><ol class="qs">${t.qs.map(q => `<li>${q}</li>`).join('')}</ol></div>`;
}
function showStep(n, scroll) {
  S.step = n;
  for (let i = 1; i <= 4; i++) $('step-' + i).hidden = i !== n;
  renderNav();
  if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
}
function missingIn(part) { return S[part].map((v, i) => v ? null : i + 1).filter(Boolean); }
function flagMissing(part, errId) {
  const miss = missingIn(part);
  document.querySelectorAll(`#items${part} .item`).forEach(el => el.classList.remove('missing'));
  if (!miss.length) { $(errId).hidden = true; return true; }
  miss.forEach(n => $(`it-${part}${n - 1}`).classList.add('missing'));
  $(errId).textContent = L().missing(miss.length, miss.join(', '));
  $(errId).hidden = false;
  $(`it-${part}${miss[0] - 1}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
  return false;
}

/* ---------- Rendering: teacher ---------- */
function renderTeacher() {
  const t = L(), box = $('teaResult');
  const parsed = parseCodes(S.tea.text);
  if (!S.tea.text.trim()) { box.innerHTML = ''; return; }
  if (!parsed.valid.length) { box.innerHTML = `<p class="err">${t.noCodes}</p>`; return; }
  const counts = {}; parsed.valid.forEach(r => { counts[r.tag] = (counts[r.tag] || 0) + 1; });
  const tags = Object.keys(counts).sort((x, y) => counts[y] - counts[x]);
  if (!tags.includes(S.tea.tag)) S.tea.tag = tags[0];
  const inTag = parsed.valid.filter(r => r.tag === S.tea.tag);
  const flagged = inTag.filter(r => !checks(r.A, r.B, r.t).allOk);
  const used = S.tea.excl ? inTag.filter(r => checks(r.A, r.B, r.t).allOk) : inTag;
  const sel = tags.length > 1
    ? `<div class="field"><label for="tagSel">${t.tagSel}</label><select id="tagSel">${tags.map(g => `<option value="${g}" ${g === S.tea.tag ? 'selected' : ''}>${g} (${counts[g]})</option>`).join('')}</select></div>` : '';
  const head = `
    ${S.tea.sample ? `<p class="sample">${t.sampleNote}</p>` : ''}
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:end">
        ${sel || `<h2>${S.tea.tag}</h2>`}
        <label class="check-row"><input type="checkbox" id="excl" ${S.tea.excl ? 'checked' : ''}> ${t.exclL}</label>
      </div>
      <div class="tiles">
        <div class="tile"><span class="k">${t.tiles.n}</span><span class="v">${used.length}</span></div>
        <div class="tile"><span class="k">${t.tiles.ex}</span><span class="v">${S.tea.excl ? flagged.length : 0}</span></div>
        <div class="tile"><span class="k">${t.tiles.bad}</span><span class="v">${parsed.bad}</span></div>
        <div class="tile"><span class="k">${t.tiles.dup}</span><span class="v">${parsed.dup}</span></div>
      </div>
    </div>`;
  if (used.length < MIN_N) { box.innerHTML = head + `<p class="err">${t.tooFew(used.length)}</p>`; return; }
  const ag = aggregate(used);
  const rows = PAT.map(p => {
    const lv = level(ag.A[p]);
    const d = ag.B[p] - ag.A[p];
    return `<tr><th scope="row">${t.pat[p][0]}</th><td class="n">${fmt(ag.A[p])}</td><td class="n">${fmt(ag.B[p])}</td><td class="n">${d >= 0 ? '+' : '−'}${fmt(Math.abs(d))}</td><td class="n">${Math.round(ag.lowA[p] * 100)} %</td><td><span class="lvl ${lv}">${t.lvl[lv]}</span></td></tr>`;
  }).join('');
  const prio = PAT.filter(p => ag.A[p] < 3.5).sort((x, y) => ag.A[x] - ag.A[y]).slice(0, 3);
  const ideaList = (p) => `<ul>${t.ideas[p].map(i => `<li>${i}</li>`).join('')}</ul>`;
  box.innerHTML = head + `
    <div class="card">
      <h2>${t.profH}</h2>
      <p class="small muted">${t.profP}</p>
      ${legendHTML()}
      ${radarHTML(ag.A, ag.B)}
      <p class="small muted">${t.radarNote}</p>
      ${dumbbellsHTML(ag.A, ag.B)}
    </div>
    <div class="card">
      <h2>${t.distH}</h2>
      <p class="small muted">${t.distP}</p>
      ${distHTML(ag.dist, S.tea.dist)}
    </div>
    <div class="card">
      <div class="tablewrap"><table><thead><tr>${t.tblH.map((h, i) => `<th class="${i && i < 5 ? 'n' : ''}">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="small muted">${t.lowNote}</p>
      <div class="row no-print"><button class="btn ghost" type="button" id="copySum">${t.copySum}</button><span class="small muted" id="summsg" role="status"></span></div>
    </div>
    <div class="card">
      <h2>${t.prioH}</h2>
      <p class="small muted">${t.prioP}</p>
      <div class="prio">${prio.length ? prio.map(p => `<article><h3>${t.pat[p][0]} · ${fmt(ag.A[p])}</h3><p class="small muted">${t.pat[p][1]}</p>${ideaList(p)}</article>`).join('') : `<p>${t.prioNone}</p>`}</div>
      <details class="info"><summary>${t.allIdeasH}</summary><div class="inner">${PAT.map(p => `<div><strong>${t.pat[p][0]}</strong>${ideaList(p)}</div>`).join('')}</div></details>
    </div>`;
  box.dataset.summary = [t.tblH.slice(0, 5).join('\t'), ...PAT.map(p => [t.pat[p][0], fmt(ag.A[p]), fmt(ag.B[p]), fmt(ag.B[p] - ag.A[p]), Math.round(ag.lowA[p] * 100) + '%'].join('\t')), `n\t${used.length}`].join('\n');
}

function renderAll() {
  renderStatic(); renderMode(); renderItems(); renderStuResult(); showStep(S.step, false);
  $('codes').value = S.tea.text; renderTeacher();
}

/* ---------- Events ---------- */
function copyText(txt, ok, fail) { try { navigator.clipboard.writeText(txt).then(ok, fail); } catch (_) { fail(); } }
function showTip(hit) {
  const fig = hit.closest('[data-tips]'), tip = fig.querySelector('.tip');
  const fr = fig.getBoundingClientRect(), hr = hit.getBoundingClientRect();
  tip.textContent = hit.dataset.tip;
  tip.style.left = (hr.left + hr.width / 2 - fr.left) + 'px';
  tip.style.top = (hr.top + hr.height / 2 - fr.top) + 'px';
  tip.hidden = false;
}
function hideTips() { document.querySelectorAll('[data-tips] .tip').forEach(x => { x.hidden = true; }); }
document.addEventListener('pointerover', (e) => { const h = e.target.closest && e.target.closest('[data-tips] .hit'); if (h) showTip(h); });
document.addEventListener('pointerout', (e) => { if (e.target.closest && e.target.closest('[data-tips] .hit')) hideTips(); });
document.addEventListener('focusin', (e) => { const h = e.target.closest && e.target.closest('[data-tips] .hit'); if (h) showTip(h); });
document.addEventListener('focusout', (e) => { if (e.target.closest && e.target.closest('[data-tips] .hit')) hideTips(); });

document.addEventListener('click', (e) => {
  const h = e.target.closest('[data-tips] .hit'); if (h) { showTip(h); return; } else hideTips();
  const dt = e.target.closest('[data-dist]');
  if (dt) { S.tea.dist = dt.dataset.dist; renderTeacher(); return; }
  const lb = e.target.closest('[data-lang]');
  if (lb) { S.lang = lb.dataset.lang; try { localStorage.setItem('klima-lang', S.lang); } catch (_) {} renderAll(); return; }
  const md = e.target.closest('[data-mode]');
  if (md) { S.mode = md.dataset.mode; renderMode(); try { history.replaceState(null, '', S.mode === 'tea' ? '#irakaslea' : location.pathname + location.search); } catch (_) {} return; }
  const g = e.target.closest('[data-goto]');
  if (g && !g.disabled) { showStep(+g.dataset.goto, true); return; }
  if (e.target.id === 'copyCode') {
    const t = L();
    copyText(S.result.code, () => { $('copymsg').textContent = t.copied; }, () => {
      $('copymsg').textContent = t.copyFail;
      const rg = document.createRange(); rg.selectNodeContents($('stucode')); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg);
    });
  }
  if (e.target.id === 'copySum') {
    const t = L();
    copyText($('teaResult').dataset.summary || '', () => { $('summsg').textContent = t.sumCopied; }, () => { $('summsg').textContent = t.copyFail; });
  }
});
$('start').addEventListener('click', () => {
  const tag = $('tag').value.toUpperCase().normalize('NFD').replace(/[^A-Z0-9]/g, '');
  $('tag').value = tag;
  if (tag.length < 2 || tag.length > 8) { $('tagerr').hidden = false; $('tag').focus(); return; }
  $('tagerr').hidden = true; S.tag = tag; S.maxStep = Math.max(S.maxStep, 2); showStep(2, true);
});
function onAnswer(e) {
  const m = e.target.name && e.target.name.match(/^([AB])(\d+)$/);
  if (!m) return;
  if (S.t0 === null) S.t0 = Date.now();
  S[m[1]][+m[2]] = +e.target.value;
  $(`it-${m[1]}${m[2]}`).classList.remove('missing');
  if (S.result) { S.result = null; S.maxStep = 3; renderStuResult(); }
  renderNav();
}
$('itemsA').addEventListener('change', onAnswer);
$('itemsB').addEventListener('change', onAnswer);
$('toB').addEventListener('click', () => { if (flagMissing('A', 'missA')) { S.maxStep = Math.max(S.maxStep, 3); showStep(3, true); } });
$('submit').addEventListener('click', () => {
  if (!flagMissing('A', 'missA')) { showStep(2, false); flagMissing('A', 'missA'); return; }
  if (!flagMissing('B', 'missB')) return;
  const secs = S.t0 ? (Date.now() - S.t0) / 1000 : 0, tOk = secs >= MIN_SEC;
  S.result = { A: S.A.slice(), B: S.B.slice(), secs, checks: checks(S.A, S.B, tOk), code: makeCode(S.lang, todayYMD(), S.tag, tOk, S.A, S.B) };
  S.maxStep = 4; renderStuResult(); showStep(4, true);
});
$('analyze').addEventListener('click', () => { S.tea.text = $('codes').value; S.tea.sample = false; S.tea.tag = ''; renderTeacher(); });
$('loadSample').addEventListener('click', () => { S.tea.text = sampleCodes(); S.tea.sample = true; S.tea.tag = ''; $('codes').value = S.tea.text; renderTeacher(); });
$('clearCodes').addEventListener('click', () => { S.tea.text = ''; S.tea.sample = false; $('codes').value = ''; renderTeacher(); });
$('teaResult').addEventListener('change', (e) => {
  if (e.target.id === 'tagSel') { S.tea.tag = e.target.value; renderTeacher(); }
  if (e.target.id === 'excl') { S.tea.excl = e.target.checked; renderTeacher(); }
});

/* ---------- Boot ---------- */
try { const l = localStorage.getItem('klima-lang'); if (l === 'eu' || l === 'es') S.lang = l; } catch (_) {}
if (/^#(irakaslea|profesorado)$/.test(location.hash)) S.mode = 'tea';
window.addEventListener('hashchange', () => { S.mode = /^#(irakaslea|profesorado)$/.test(location.hash) ? 'tea' : 'stu'; renderMode(); });
S.tea.text = sampleCodes();
renderAll();

window.__klima = { ITEMS, PAT, patScores, checks, makeCode, parseCodes, aggregate, checksum, sampleCodes };
})();
</script>

</html>

<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<title>BFI-2-S Nortasun-testa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column; a sticky step bar carries the flow (abiapuntua → teoria → testa → emaitza → hausnarketa). Bloke 3 identity: plum. */
:root {
  --bg: #fdfbfd;
  --surface: #ffffff;
  --fg: #221a23;
  --muted: #6a5a6c;
  --line: #ece3ed;
  --accent: #5C1A5C;
  --accent-soft: #f6e9f6;
  --accent-ink: #ffffff;
  --ok: #1d6e46;
  --ok-soft: #dcefe4;
  --warn: #8a4b00;
  --warn-soft: #fbe8d2;
  --font-display: 'Nunito', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --radius: 12px;
}
:root { color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 3rem;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 780px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 900; letter-spacing: -0.01em; }
h2 { font-size: 1.55rem; font-weight: 800; }
h3 { font-size: 1.12rem; font-weight: 800; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* header */
.top { padding-block: 2.2rem 1.2rem; display: grid; gap: 0.9rem; }
.top-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.eyebrow { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.lead { color: var(--muted); max-width: 62ch; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button { border: 0; background: transparent; padding: 0.3rem 0.85rem; border-radius: 999px; font-weight: 600; font-size: 0.85rem; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* steps */
.steps { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 0.6rem; border-bottom: 1px solid var(--line); margin-bottom: 1.8rem; }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.35rem; }
.steps button { width: 100%; border: 0; background: transparent; cursor: pointer; padding: 0.35rem 0.2rem 0.45rem; text-align: left; border-top: 3px solid var(--line); font-size: 0.8rem; color: var(--muted); font-weight: 500; }
.steps button .n { display: block; font-family: var(--font-display); font-weight: 900; font-size: 0.95rem; }
.steps button[aria-current="step"] { border-top-color: var(--accent); color: var(--fg); }
.steps button.done { border-top-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.steps button:disabled { cursor: not-allowed; opacity: 0.45; }
@media (max-width: 520px) { .steps button .lbl { display: none; } .steps button { text-align: center; } }
.progress { height: 4px; background: var(--line); border-radius: 4px; margin-top: 0.5rem; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.progress-label { font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; font-variant-numeric: tabular-nums; }

section.step { display: grid; gap: 1.4rem; }
.galdera-gidaria { font-family: var(--font-display); font-size: 1.4rem; font-weight: 900; color: var(--accent); line-height: 1.3; border-left: 4px solid var(--accent); padding-left: 1rem; }
.fenomenoa { background: var(--accent-soft); border-radius: var(--radius); padding: 1.1rem 1.2rem; font-style: italic; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.2rem; display: grid; gap: 0.9rem; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.prose { display: grid; gap: 0.75rem; max-width: 66ch; }
.prose ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.45rem; }

/* buttons */
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 0.6rem 1.1rem; border-radius: 999px; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
.next { justify-content: flex-end; }

/* barnum */
.field { display: grid; gap: 0.4rem; }
.field label, .field .lbl { font-weight: 600; font-size: 0.92rem; }
select, input[type="text"] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem 0.7rem; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0.35rem 0.8rem 0.35rem 0.4rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.9rem; }
.chip .sw { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 1px solid var(--line); }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; font-weight: 600; }
.chip.plain { padding-left: 0.8rem; }
.profile { border-left: 4px solid var(--accent); padding-left: 1rem; display: grid; gap: 0.6rem; }
.rate { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.rate button { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
.rate button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* theory */
.domains { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0.7rem; }
.dom { border: 1px solid var(--line); border-radius: var(--radius); padding: 0.9rem 1rem; background: var(--surface); display: grid; gap: 0.35rem; align-content: start; }
.dom .letter { font-family: var(--font-display); font-weight: 900; font-size: 1.5rem; color: var(--accent); line-height: 1; }
.dom .facets { font-size: 0.8rem; color: var(--muted); }
.concept { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 0.4rem 1rem; }
.concept dt { font-weight: 600; font-family: var(--font-display); }
.concept dd { margin: 0; }
@media (max-width: 560px) { .concept { grid-template-columns: minmax(0, 1fr); } .concept dd { margin-bottom: 0.5rem; } }

/* test */
.notice { background: var(--accent-soft); border-radius: var(--radius); padding: 1rem 1.1rem; display: grid; gap: 0.4rem; }
.badge { display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.2rem 0.6rem; border-radius: 999px; border: 1px solid currentColor; }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); }
.scale-legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.3rem; text-align: center; font-size: 0.78rem; color: var(--muted); line-height: 1.25; }
.scale-legend b { display: block; font-family: var(--font-display); font-size: 1rem; color: var(--fg); }
.items { display: grid; gap: 0; border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; align-items: center; gap: 0.4rem 0.8rem; padding: 0.7rem 0.2rem; border-bottom: 1px solid var(--line); }
.item.missing { background: var(--warn-soft); }
.item .num { font-family: var(--font-display); font-weight: 900; color: var(--muted); font-variant-numeric: tabular-nums; }
.opts { display: flex; gap: 0.3rem; border: 0; margin: 0; padding: 0; }
.opts input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opts label { width: 2.3rem; height: 2.3rem; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.opts input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opts input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 600px) {
  .item { grid-template-columns: 1.8rem minmax(0, 1fr); }
  .opts { grid-column: 2; }
  .opts label { width: 2.5rem; height: 2.5rem; }
}
.err { color: var(--warn); font-weight: 600; }

/* results */
.verdict { border-radius: var(--radius); padding: 1rem 1.2rem; display: grid; gap: 0.3rem; }
.verdict.ok { background: var(--ok-soft); }
.verdict.warn { background: var(--warn-soft); }
.verdict .tag { font-family: var(--font-display); font-weight: 900; letter-spacing: 0.06em; font-size: 1.15rem; }
.verdict.ok .tag { color: var(--ok); } .verdict.warn .tag { color: var(--warn); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
.checks li { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 0.5rem; align-items: start; }
.checks .ic { width: 1.4rem; height: 1.4rem; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; font-weight: 800; }
.checks .ic.ok { background: var(--ok-soft); color: var(--ok); }
.checks .ic.warn { background: var(--warn-soft); color: var(--warn); }
.checks .ic.na { background: var(--line); color: var(--muted); }
.bars { display: grid; gap: 1.3rem; }
.bar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.bar-head .score { font-family: var(--font-display); font-weight: 900; font-size: 1.4rem; font-variant-numeric: tabular-nums; color: var(--accent); }
.track { position: relative; height: 12px; background: var(--accent-soft); border-radius: 999px; margin: 0.5rem 0 0.2rem; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; }
.track .mid { position: absolute; left: 50%; top: -4px; bottom: -4px; border-left: 2px dashed var(--muted); }
.ticks { position: relative; height: 1.1em; font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.ticks span { position: absolute; top: 0; transform: translateX(-50%); }
.ticks span:first-child { transform: none; } .ticks span:last-child { transform: translateX(-100%); }
.mid-legend { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 0.5rem; }
.mid-legend i { width: 0; height: 1em; border-left: 2px dashed var(--muted); }
.result-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem; }
.code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.95rem; letter-spacing: 0.03em; background: var(--accent-soft); padding: 0.55rem 0.8rem; border-radius: 8px; overflow-wrap: anywhere; user-select: all; }
.support { font-size: 0.88rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 0.8rem; }

/* reflection */
.compare { overflow-x: auto; }
.compare table { width: 100%; border-collapse: collapse; font-size: 0.92rem; min-width: 480px; }
.compare th, .compare td { text-align: left; padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.compare thead th { font-family: var(--font-display); font-weight: 800; color: var(--accent); }
.questions { margin: 0; padding-left: 1.3rem; display: grid; gap: 0.8rem; }
.questions li::marker { font-family: var(--font-display); font-weight: 900; color: var(--accent); }
.final-q { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.5rem, 4vw, 2rem); color: var(--accent); text-align: left; padding-block: 1rem; text-wrap: balance; }

/* teacher + footer */
details.teacher { margin-top: 3rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.teacher > summary { cursor: pointer; padding: 1rem 1.2rem; font-family: var(--font-display); font-weight: 800; }
details.teacher .inner { padding: 0 1.2rem 1.2rem; display: grid; gap: 1rem; }
.keytable { overflow-x: auto; }
.keytable table { border-collapse: collapse; font-size: 0.86rem; width: 100%; min-width: 420px; }
.keytable td, .keytable th { padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--line); text-align: left; font-variant-numeric: tabular-nums; }
footer.src { margin-top: 2rem; font-size: 0.8rem; color: var(--muted); display: grid; gap: 0.4rem; }
footer.src p { padding-left: 1.4rem; text-indent: -1.4rem; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media print {
  body { background: #fff; color: #000; }
  .steps, .top .lang, .no-print, details.teacher, footer.src, section.step:not(#step-4) { display: none !important; }
  #step-4 { display: grid !important; }
}
</style>

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function fmt(n) { return S.lang === 'eu' || S.lang === 'es' ? n.toFixed(2).replace('.', ',') : n.toFixed(2); }

/* ---------- Scoring + validation (pure) ---------- */
function score(answers) {
  const out = {};
  for (const d of DOMS) {
    const its = ITEMS.filter(i => i[1] === d);
    out[d] = its.reduce((s, i) => s + (i[2] ? 6 - answers[i[0]-1] : answers[i[0]-1]), 0) / its.length;
  }
  return out;
}
function checks(answers, seconds) {
  const n = answers.filter(a => a > 0).length;
  const mean = answers.reduce((s, a) => s + a, 0) / 30;
  const facets = {};
  ITEMS.forEach(i => (facets[i[3]] = facets[i[3]] || []).push(answers[i[0]-1]));
  let contra = 0;
  Object.values(facets).forEach(([a, b]) => { if ((a >= 4 && b >= 4) || (a <= 2 && b <= 2)) contra++; });
  let run = 1, best = 1;
  for (let i = 1; i < 30; i++) { run = answers[i] === answers[i-1] ? run + 1 : 1; best = Math.max(best, run); }
  return {
    complete: { ok: n === 30, n },
    acq: { ok: mean >= 2.25 && mean <= 3.75, m: mean },
    cons: { ok: contra <= 4, k: contra },
    pat: { ok: best < 8, r: best },
    time: seconds == null ? { ok: null } : { ok: seconds >= 60, s: seconds }
  };
}

/* ---------- Verification code ---------- */
function checksum(s) {
  let h = 7;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i) * (i + 1)) % 1296;
  return h.toString(36).toUpperCase().padStart(2, '0');
}
function makeCode(lang, ymd, answers) {
  const l = lang === 'eu' ? 'E' : 'C';
  const a = answers.join('');
  const groups = [0,5,10,15,20,25].map(k => a.slice(k, k + 5));
  return `B2S-${l}${ymd}-${groups.join('-')}-${checksum(l + ymd + a)}`;
}
function parseCode(str) {
  const c = str.toUpperCase().replace(/\s+/g, '');
  const m = c.match(/^B2S-([EC])(\d{6})-([1-5]{5})-([1-5]{5})-([1-5]{5})-([1-5]{5})-([1-5]{5})-([1-5]{5})-([0-9A-Z]{2})$/);
  if (!m) return null;
  const a = m.slice(3, 9).join('');
  if (checksum(m[1] + m[2] + a) !== m[9]) return null;
  return { lang: m[1] === 'E' ? 'eu' : 'es', ymd: m[2], answers: a.split('').map(Number) };
}
function todayYMD() {
  const d = new Date();
  return String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
}
function fmtDate(ymd) {
  const y = '20' + ymd.slice(0, 2), m = ymd.slice(2, 4), d = ymd.slice(4, 6);
  return S.lang === 'eu' ? `${y}/${m}/${d}` : `${d}/${m}/${y}`;
}
function fmtTime(sec) {
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return S.lang === 'eu' ? `${m} min ${s} s` : `${m} min ${s} s`;
}

function resultHTML(r, opts) {

    [c.pat.ok, t.chkPat, t.chkPatD(c.pat.r)],
    [c.time.ok, t.chkTime, c.time.ok === null ? t.chkTimeNA : t.chkTimeD(fmtTime(c.time.s))]
  ].map(([ok, h, d]) => `<li>${ic(ok)}<div><strong>${h}.</strong> <span class="small">${d}</span></div></li>`).join('');
  const bars = DOMS.map(d => {
    const s = r.scores[d];
    const pos = s >= 3.5 ? 'hi' : s <= 2.5 ? 'lo' : 'mid';
    const pct = (s - 1) / 4 * 100;
    return `<div>
      <div class="bar-head"><h3>${t.domNames[d]}</h3><span class="score">${fmt(s)}</span></div>
      <div class="track" role="img" aria-label="${t.domNames[d]}: ${fmt(s)} / 5"><span class="fill" style="width:${pct}%"></span><span class="mid"></span></div>
      <div class="ticks">${[1,2,3,4,5].map(v => `<span style="left:${(v-1)*25}%">${v}</span>`).join('')}</div>
      <p class="small" style="margin-top:.4rem"><strong>${cap(t.pos[pos])}.</strong> ${t.desc[d][pos]}</p>
    </div>`;
  }).join('');
  const name = opts.name ? `<div class="field"><span class="lbl">${S.lang === 'eu' ? 'Izena' : 'Nombre'}</span><span>${esc(opts.name)}</span></div>` : '';
  return `<div class="card">
    <div class="verdict ${allOk ? 'ok' : 'warn'}"><span class="tag">${allOk ? t.okTag : t.warnTag}</span><span class="small">${allOk ? t.okSub : t.warnSub}</span></div>
    <ul class="checks">${chk}</ul>
  </div>
  <div class="card"><p class="mid-legend"><i></i>3 = ${t.midNote}</p><div class="bars">${bars}</div><p class="small muted">${t.poles}</p><p class="support">${t.support}</p></div>
  <div class="card">
    <div class="result-meta">
      ${name}
      <div class="field"><span class="lbl">${t.dateL}</span><span>${fmtDate(r.ymd)}</span></div>
      <div class="field"><span class="lbl">${t.langL}</span><span>${r.lang === 'eu' ? t.langEU : t.langES}</span></div>
    </div>
    <div class="field"><span class="lbl">${t.codeL}</span><div class="code" ${opts.idAttr || ''}>${r.code}</div><span class="small muted">${t.codeHelp}</span></div>
  </div>`;
}
function esc(s) { return s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }
function renderResult() {
  if (!S.result) { $('result').innerHTML = ''; return; }
  $('result').innerHTML = resultHTML(S.result, { name: $('res-name').value.trim(), idAttr: 'id="rescode"' });
  $('print').hidden = inFrame;
}
function renderReflection() {
  const t = L();
  $('reveal').innerHTML = (S.bm.rating ? t.revealRated(S.bm.rating) : t.revealNot) + t.reveal;
  $('compare').innerHTML = `<table><thead><tr>${t.cmpHead.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${t.cmpRows.map(r => `<tr><th scope="row">${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table>`;
  $('questions').innerHTML = t.qs.map(q => `<li>${q}</li>`).join('');
}
function renderTeacher() {
  const t = L();
  const rows = DOMS.map(d => {
    const its = ITEMS.filter(i => i[1] === d);
    return `<tr><td>${t.domNames[d]}</td><td>${its.map(i => i[0] + (i[2] ? 'R' : '')).join(', ')}</td><td>${its.map(i => i[6]).join(', ')}</td></tr>`;
  }).join('');
  $('keytable').innerHTML = `<table><thead><tr>${t.keyHead.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
  $('sources').innerHTML = `<strong>${t.sources}</strong>` + SOURCES.map(s => `<p>${s}</p>`).join('');
}
function showStep(n, scroll) {
  S.step = n;
  for (let i = 1; i <= 5; i++) $('step-' + i).hidden = i !== n;
  if (n === 5) renderReflection();
  renderNav();
  if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
}
function renderAll() {
  renderStatic(); renderBarnum(); renderTheory(); renderTest(); renderResult(); renderReflection(); renderTeacher(); showStep(S.step, false);
  const v = $('verify-in').value.trim();
  if (v && $('verify-out').innerHTML) doVerify();
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-goto]');
  if (g && !g.disabled) { showStep(+g.dataset.goto, true); return; }
  const lb = e.target.closest('[data-lang]');
  if (lb) { S.lang = lb.dataset.lang; try { localStorage.setItem('bfi2s-lang', S.lang); } catch (_) {} renderAll(); return; }
  const col = e.target.closest('[data-color]');
  if (col) { S.bm.color = +col.dataset.color; renderBarnum(); return; }
  const pl = e.target.closest('[data-place]');
  if (pl) { S.bm.place = +pl.dataset.place; renderBarnum(); return; }
  const rt = e.target.closest('[data-rate]');
  if (rt) { S.bm.rating = +rt.dataset.rate; renderBarnum(); return; }
});
$('bm-month').addEventListener('change', (e) => { S.bm.month = e.target.value; });
$('bm-go').addEventListener('click', () => {
  if (S.bm.month === '' || S.bm.color < 0 || S.bm.place < 0) { $('bm-go').textContent = L().bmNeed; setTimeout(() => { $('bm-go').textContent = L().bmGo; }, 1800); return; }
  S.bm.shown = true; renderBarnum();
});
$('items').addEventListener('change', (e) => {
  const m = e.target.name && e.target.name.match(/^q(\d+)$/);
  if (!m) return;
  if (S.t0 === null) S.t0 = Date.now();
  S.answers[+m[1] - 1] = +e.target.value;
  $('item-' + m[1]).classList.remove('missing');
  if (S.result) { S.result = null; S.maxStep = 3; renderResult(); renderNav(); }
  updateProgress();
});
$('submit').addEventListener('click', () => {
  const miss = S.answers.map((a, i) => a ? null : i + 1).filter(Boolean);
  document.querySelectorAll('.item').forEach(el => el.classList.remove('missing'));
  if (miss.length) {
    miss.forEach(n => $('item-' + n).classList.add('missing'));
    $('missing').textContent = L().missing(miss.length, miss.join(', '));
    $('missing').hidden = false;
    $('item-' + miss[0]).scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  $('missing').hidden = true;
  const secs = S.t0 ? (Date.now() - S.t0) / 1000 : 0;
  const ymd = todayYMD();
  S.result = { lang: S.lang, ymd, scores: score(S.answers), checks: checks(S.answers, secs), code: makeCode(S.lang, ymd, S.answers) };
  S.maxStep = 5;
  renderResult();
  showStep(4, true);
});
$('res-name').addEventListener('input', () => renderResult());
$('print').addEventListener('click', () => window.print());
$('copy').addEventListener('click', () => {
  if (!S.result) return;
  const t = L(), r = S.result, c = r.checks;
  const allOk = c.complete.ok && c.acq.ok && c.cons.ok && c.pat.ok && c.time.ok !== false;
  const name = $('res-name').value.trim();
  const txt = [
    `BFI-2-S · ${name ? name + ' · ' : ''}${fmtDate(r.ymd)}`,
    allOk ? t.okTag : t.warnTag,
    ...DOMS.map(d => `${t.domNames[d]}: ${fmt(r.scores[d])} / 5`),
    `${t.codeL}: ${r.code}`
  ].join('\n');
  const done = () => { $('copymsg').textContent = t.copied; };
  const fail = () => {
    $('copymsg').textContent = t.copyFail;
    const el = $('rescode');
    if (el) { const rg = document.createRange(); rg.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); }
  };
  try { navigator.clipboard.writeText(txt).then(done, fail); } catch (_) { fail(); }
});
function doVerify() {
  const t = L();
  const p = parseCode($('verify-in').value);
  if (!p) { $('verify-out').innerHTML = `<p class="err">${t.verifyBad}</p>`; return; }
  const r = { lang: p.lang, ymd: p.ymd, scores: score(p.answers), checks: checks(p.answers, null), code: makeCode(p.lang, p.ymd, p.answers) };
  $('verify-out').innerHTML = `<p class="small" style="color:var(--ok);font-weight:600">${t.verifyOk}</p><div style="display:grid;gap:1rem">${resultHTML(r, {})}</div>`;
}
$('verify-go').addEventListener('click', doVerify);

/* ---------- Boot ---------- */
try { const l = localStorage.getItem('bfi2s-lang'); if (l === 'eu' || l === 'es') S.lang = l; } catch (_) {}
renderAll();

// expose pure functions for testing
window.__bfi2s = { ITEMS, score, checks, makeCode, parseCode };
})();
</script>

</html>
